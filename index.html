<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wax & Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --water:#2B4C69;
  --sheet:#F3F5F1;
  --sheet-2:#E4E9E3;
  --text:#1C2530;
  --muted:#59646F;
  --line:#CBD3CB;
  --signal:#F2B705;
  --signal-ink:#1C2530;
  --src:#F2B705;
  --dest:#FF2E88;
  --danger:#B3261E;
  --shadow:0 -6px 24px rgba(10,20,30,.28);
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --water:#1A3247;
    --sheet:#17212B;
    --sheet-2:#22303C;
    --text:#E7ECEF;
    --muted:#9AA7B2;
    --line:#2F3E4B;
    --shadow:0 -6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --water:#1A3247;--sheet:#17212B;--sheet-2:#22303C;--text:#E7ECEF;--muted:#9AA7B2;--line:#2F3E4B;--shadow:0 -6px 24px rgba(0,0,0,.5);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--water);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;display:flex;gap:8px;align-items:center;background:linear-gradient(var(--water),color-mix(in srgb,var(--water) 70%,transparent));z-index:5}
#brand{font-family:var(--display);color:#F3F5F1;font-size:20px;letter-spacing:.5px;white-space:nowrap}
#chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);color:#F3F5F1;border-radius:999px;padding:4px 10px 4px 6px;font-size:13px;white-space:nowrap;border:2px solid transparent}
.chip.now{border-color:var(--signal)}
.chip .dot{width:14px;height:14px;border-radius:50%;border:2px solid #fff}
.chip b{font-weight:700}
#menuBtn{background:rgba(255,255,255,.14);color:#F3F5F1;border:0;border-radius:10px;padding:8px 12px;font:700 14px var(--body)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:44%;display:flex;flex-direction:column;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:var(--shadow);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);transition:max-height .22s ease}
#sheet.collapsed{max-height:calc(64px + env(safe-area-inset-bottom,0px))}
#sheet.full{max-height:100%;top:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
#grab{border:0;background:none;padding:8px 0 2px;width:100%;cursor:pointer}
#grab span{display:block;margin:0 auto;width:44px;height:5px;border-radius:3px;background:var(--line)}
#sheetBody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
#sheet.full #grab{display:none}
h1.title{font-family:var(--display);font-weight:400;font-size:42px;line-height:1;margin:18px 0 6px;letter-spacing:.5px}
.crayon-under{display:block;width:220px;height:14px;margin-bottom:14px}
h2{font-size:15px;margin:18px 0 8px;color:var(--muted);font-weight:700}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.status{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px;min-height:30px}
.status .dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid var(--sheet)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.btn{font:700 15px var(--body);border-radius:12px;border:2px solid var(--line);background:var(--sheet);color:var(--text);padding:10px 14px;min-height:44px;cursor:pointer}
button.btn.go{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
button.btn.warn{color:var(--danger)}
button.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.box{background:var(--sheet-2);border-radius:14px;padding:12px;margin:10px 0}
.box.hl{outline:3px solid var(--signal)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--sheet-2);border-radius:12px;padding:6px;border:2px solid var(--line)}
.dem{display:flex;justify-content:space-between;gap:6px;width:100%;text-align:left;border:0;background:none;color:var(--text);font:400 14px var(--body);padding:7px 6px;border-radius:8px;cursor:pointer}
.dem+.dem{border-top:1px dashed var(--line)}
.dem.sel{background:var(--signal);color:var(--signal-ink)}
.dem .pay{font-weight:700;white-space:nowrap}
.dem .ok{font-weight:700}
.loads{display:flex;gap:6px;flex-wrap:wrap}
.load{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-weight:700;font-size:14px}
.load button{border:0;background:var(--sheet-2);color:var(--text);border-radius:50%;width:26px;height:26px;font-weight:700;cursor:pointer}
.empty-load{color:var(--muted);font-size:14px}
.log{list-style:none;padding:0;margin:0;font-size:13px;color:var(--muted)}
.log li{padding:3px 0}
.game{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.game:first-child{border-top:0}
label.f{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
input.t{font:400 16px var(--body);width:100%;max-width:320px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--sheet);color:var(--text)}
.swatches{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
.sw:disabled{opacity:.2;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.goal{font-size:14px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 58px);background:var(--text);color:var(--sheet);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:9;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#overlay{position:absolute;inset:0;background:rgba(15,25,35,.78);z-index:8;display:flex;align-items:center;justify-content:center;padding:24px}
#overlay[hidden]{display:none}
#overlay .inner{background:var(--sheet);border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center}
#overlay h3{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 8px}
.zoom{position:absolute;right:10px;top:70px;display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.9);color:#1C2530;font:700 20px var(--body);box-shadow:0 2px 6px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}#toast{transition:none}}

.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted)}
.legend .key{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
.log.ev{color:var(--text)}
.log.ev li{padding:6px 0;border-top:1px dashed var(--line)}
.log.ev li:first-child{border-top:0}
.dem.sel{background:var(--dest);color:#fff}
</style>
</head>

  LANDS=def.land.map(pr);LAKES=def.lakes.map(pr);MOUNT=def.mount.map(pr);ALPINE=def.alpine.map(pr);RIVERS=def.rivers.map(([name,pts])=>({name,pts:pr(pts)}));
  GOODS=def.goods;payCache=new Map();regionCache=new Map();
  if(MAP_CACHE[id]){({SP,RH,COLS,ROWS,NODES,GRID,ADJ,EDGE,CITY,CITY_BY_NAME,MAJORS,CITY_LIST,GOOD_LIST,FERRIES}=MAP_CACHE[id]);return;}
  SP=def.sp;RH=SP*Math.sqrt(3)/2;COLS=Math.floor(MW/SP)+1;ROWS=Math.floor(MH/RH)+1;
  NODES=[];GRID=new Int32Array(COLS*ROWS).fill(-1);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const x=c*SP+(r&1?SP/2:0),y=r*RH;if(x>MW)continue;if(!isLand(x,y))continue;let t=0;if(ALPINE.some(a=>pip([x,y],a)))t=2;else if(MOUNT.some(a=>pip([x,y],a)))t=1;GRID[r*COLS+c]=NODES.length;NODES.push({x,y,r,c,t});}
  const nbrRC=(r,c)=>r&1?[[r,c-1],[r,c+1],[r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]]:[[r,c-1],[r,c+1],[r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]];
  ADJ=NODES.map(()=>[]);EDGE=new Map();
  NODES.forEach((n,i)=>{for(const[rr,cc]of nbrRC(n.r,n.c)){if(rr<0||cc<0||rr>=ROWS||cc>=COLS)continue;const j=GRID[rr*COLS+cc];if(j<=i)continue;const m=NODES[j];if(!isLand((n.x+m.x)/2,(n.y+m.y)/2))continue;const rivers=[];RIVERS.forEach((rv,ri)=>{for(let k=0;k<rv.pts.length-1;k++)if(segX([n.x,n.y],[m.x,m.y],rv.pts[k],rv.pts[k+1])){rivers.push(ri);break;}});const info={rivers,ferry:null};EDGE.set(key(i,j),info);ADJ[i].push({j,info});ADJ[j].push({j:i,info});}});
  CITY=new Map();CITY_BY_NAME={};MAJORS=[];
  for(const[name,lon,lat,size]of def.cities){const[x,y]=P(lon,lat);let best=-1,bd=1e9;NODES.forEach((n,i)=>{if(CITY.has(i))return;const d=(n.x-x)**2+(n.y-y)**2;if(d<bd){bd=d;best=i;}});CITY.set(best,{name,size,goods:[],node:best});CITY_BY_NAME[name]=best;if(size===3)MAJORS.push(best);}
  for(const g in GOODS)for(const n of GOODS[g]){const c=CITY.get(CITY_BY_NAME[n]);if(c)c.goods.push(g);}
  FERRIES=[];for(const[a,b,cost,moves]of def.ferries){const i=CITY_BY_NAME[a],j=CITY_BY_NAME[b];if(i==null||j==null)continue;const k=key(i,j);if(EDGE.has(k))continue;const info={rivers:[],ferry:{cost,moves,a:i,b:j}};EDGE.set(k,info);ADJ[i].push({j,info});ADJ[j].push({j:i,info});FERRIES.push({i,j,k,cost,moves});}
  CITY_LIST=[...CITY.keys()];GOOD_LIST=Object.keys(GOODS);
  MAP_CACHE[id]={SP,RH,COLS,ROWS,NODES,GRID,ADJ,EDGE,CITY,CITY_BY_NAME,MAJORS,CITY_LIST,GOOD_LIST,FERRIES};
}
const nodeCost=v=>{const c=CITY.get(v);if(c)return c.size===3?5:3;return[1,2,5][NODES[v].t];};

/* ================= Pathfinding ================= */
class Heap{constructor(){this.a=[]}get size(){return this.a.length}push(p,v){const a=this.a;a.push([p,v]);let i=a.length-1;while(i>0){const q=(i-1)>>1;if(a[q][0]<=a[i][0])break;[a[q],a[i]]=[a[i],a[q]];i=q;}}pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){let l=2*i+1,r=l+1,m=i;if(l<a.length&&a[l][0]<a[m][0])m=l;if(r<a.length&&a[r][0]<a[m][0])m=r;if(m===i)break;[a[m],a[i]]=[a[i],a[m]];i=m;}}return top;}}
function dijkstra(srcs,w,limit){const n=NODES.length,dist=new Float64Array(n).fill(Infinity),prev=new Int32Array(n).fill(-1),hops=new Int32Array(n);const h=new Heap();for(const s of srcs){dist[s]=0;h.push(0,s);}while(h.size){const[d,u]=h.pop();if(d>dist[u])continue;for(const e of ADJ[u]){const wt=w(u,e.j,e.info);if(wt==null)continue;const nd=d+wt;if(limit!=null&&nd>limit+1e-6)continue;if(nd<dist[e.j]){dist[e.j]=nd;prev[e.j]=u;hops[e.j]=hops[u]+(e.info.ferry?e.info.ferry.moves:1);h.push(nd,e.j);}}}return{dist,prev,hops};}
function walk(prev,t){const p=[t];while(prev[p[p.length-1]]>=0)p.push(prev[p[p.length-1]]);return p.reverse();}
const baseCost=(v,info)=>info.ferry?info.ferry.cost:nodeCost(v)+(info.rivers.length?2:0);
function payout(good,dest){const k=good+'>'+dest;if(payCache.has(k))return payCache.get(k);const srcs=GOODS[good].map(n=>CITY_BY_NAME[n]).filter(x=>x!=null);const r=dijkstra(srcs,(u,v,info)=>baseCost(v,info));const h=r.hops[dest],c=r.dist[dest];const v={hops:h,pay:Math.max(8,Math.min(70,Math.round(3+h*0.9+c*0.35)))};payCache.set(k,v);return v;}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeCard(){const out=[];let guard=0;while(out.length<3&&guard++<800){const g=pick(GOOD_LIST),d=pick(CITY_LIST);if(CITY.get(d).goods.includes(g))continue;if(out.some(o=>o.dest===d||o.good===g))continue;const{hops,pay}=payout(g,d);if(!isFinite(pay)||hops<7)continue;out.push({good:g,dest:d,pay});}return out;}
function regionSet(center,r){const k=center+':'+r+':'+MAPID;if(regionCache.has(k))return regionCache.get(k);const s=new Set([center]);let f=[center];for(let i=0;i<r;i++){const nf=[];for(const u of f)for(const e of ADJ[u]){if(e.info.ferry||s.has(e.j))continue;s.add(e.j);nf.push(e.j);}f=nf;}regionCache.set(k,s);return s;}

/* ================= Rules ================= */
const TRAINS=[{name:'Freight',speed:9,cap:2},{name:'Express',speed:12,cap:2},{name:'Heavy Haul',speed:9,cap:3},{name:'Super Express',speed:12,cap:3}];
const UPG={0:[1,2],1:[3],2:[3],3:[]};
const LENGTHS={quick:{label:'Quick',cash:100,majors:4},short:{label:'Short',cash:150,majors:5},classic:{label:'Classic',cash:250,majors:7}};
const COLORS=[['Red','#D62839'],['Green','#2A9D4B'],['Purple','#7D3CC0'],['Orange','#F07F13']];
const BUILD_BUDGET=20,USE_FEE=4,UPGRADE_COST=20,EVENT_CHANCE=0.17;
const EV_STYLE={derail:{label:'Derailment',color:'rgba(214,40,57,.22)',stroke:'#D62839',icon:'⚠'},strike:{label:'Strike',color:'rgba(125,60,192,.2)',stroke:'#7D3CC0',icon:'✋'},snow:{label:'Blizzard',color:'rgba(255,255,255,.45)',stroke:'#FFFFFF',icon:'❄'},flood:{label:'Flood',icon:'🌊'},tax:{label:'Tax',icon:'$'}};

function newGame(opts){return{v:2,id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6),rev:0,status:'setup',created:Date.now(),len:opts.len||'short',map:opts.map||'na',eventsOn:opts.eventsOn!==false,players:[],track:{},turn:null,seq:[],log:[],events:[],lastEvent:null,winner:null};}
function addPlayer(g,seat,name,color){g.players.push({seat,name,color,cash:50,train:0,pos:null,loads:[],stalled:false,cards:[makeCard(),makeCard(),makeCard()]});}
function log(g,s){g.log.unshift(s);g.log=g.log.slice(0,30);}
function startGame(g){const n=g.players.length,a=[...Array(n).keys()];g.seq=[...a,...a.slice().reverse()];g.status='playing';g.turn=null;beginTurn(g,g.seq[0],'init',0);log(g,'Game on. Everyone gets two building turns first.');}
function inEvent(g,type,node){return(g.events||[]).some(e=>e.type===type&&e.center!=null&&regionSet(e.center,e.r).has(node));}
function floodedRivers(g){return(g.events||[]).filter(e=>e.type==='flood').map(e=>e.river);}
function beginTurn(g,p,kind,seqIdx){const pl=g.players[p],sp=TRAINS[pl.train].speed;let moves=sp;
  if(kind==='op'){if(pl.stalled){moves=0;pl.stalled=false;log(g,pl.name+'’s crew is cleaning up the derailment. No moving this turn.');}else if(pl.pos!=null&&inEvent(g,'snow',pl.pos))moves=Math.floor(sp/2);}
  g.turn={p,kind,seqIdx,phase:kind==='init'?'build':'move',moves,spent:0,builds:[],upgraded:false,fees:[],acted:false,n:(g.turn?.n||0)+1};}
function netNodes(g,p){const s=new Set();for(const k in g.track)if(g.track[k]===p){const[a,b]=k.split('-');s.add(+a);s.add(+b);}return s;}
function majorsConnected(g,p){const par=new Map();const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};for(const k in g.track)if(g.track[k]===p){const[a,b]=k.split('-').map(Number);if(!par.has(a))par.set(a,a);if(!par.has(b))par.set(b,b);const ra=f(a),rb=f(b);if(ra!==rb)par.set(ra,rb);}const cnt=new Map();for(const m of MAJORS)if(par.has(m)){const r=f(m);cnt.set(r,(cnt.get(r)||0)+1);}let mx=0;for(const v of cnt.values())mx=Math.max(mx,v);return mx;}
function endTurn(g){const t=g.turn,pl=g.players[t.p],L=LENGTHS[g.len];
  if(t.kind==='op'&&pl.cash>=L.cash&&majorsConnected(g,t.p)>=L.majors){g.status='over';g.winner=t.p;log(g,pl.name+' wins with $'+pl.cash+'M!');return;}
  const before=(g.events||[]).length;g.events=(g.events||[]).filter(e=>!(e.by===t.p&&t.n>e.n));if(g.events.length<before)log(g,'Some trouble on the line has cleared up.');
  if(t.kind==='init'){if(t.seqIdx+1<g.seq.length){beginTurn(g,g.seq[t.seqIdx+1],'init',t.seqIdx+1);return;}beginTurn(g,(t.p+1)%g.players.length,'op',0);log(g,'Building’s done. Place your trains and start hauling.');return;}
  beginTurn(g,(t.p+1)%g.players.length,'op',0);}
function buildPath(g,p,target){const net=netNodes(g,p);const srcs=[...new Set([...net,...MAJORS])];const fl=floodedRivers(g);
  const r=dijkstra(srcs,(u,v,info)=>{const o=g.track[key(u,v)];if(o===p)return 0;if(o!==undefined)return null;if(fl.length&&info.rivers.some(x=>fl.includes(x)))return null;if(inEvent(g,'snow',v)||inEvent(g,'snow',u))return null;return baseCost(v,info);});
  if(!isFinite(r.dist[target])||r.dist[target]===0)return null;const path=walk(r.prev,target);const edges=[];for(let i=0;i<path.length-1;i++){const k=key(path[i],path[i+1]);if(g.track[k]!==p)edges.push(k);}if(!edges.length)return null;return{path,edges,cost:r.dist[target]};}
function moveMap(g){const t=g.turn,pl=g.players[t.p];if(pl.pos==null||t.moves<=0)return null;return dijkstra([pl.pos],(u,v,info)=>{const o=g.track[key(u,v)];if(o===undefined)return null;return(info.ferry?info.ferry.moves:1)+(o===t.p?0:0.001);},t.moves);}
function movePlan(g,target){const mm=moveMap(g);if(!mm||!isFinite(mm.dist[target])||target===g.players[g.turn.p].pos)return null;const path=walk(mm.prev,target);const owners=new Set();for(let i=0;i<path.length-1;i++){const o=g.track[key(path[i],path[i+1])];if(o!==g.turn.p)owners.add(o);}const newOwners=[...owners].filter(o=>!g.turn.fees.includes(o));return{path,steps:Math.round(mm.dist[target]),owners:newOwners,fee:newOwners.length*USE_FEE};}

/* ---------- events ---------- */
function applyEvent(g,by){
  const W=[['derail',3],['flood',2],['strike',3],['snow',3],['tax',1]];let r=Math.random()*12,type='derail';for(const[t,w]of W){if((r-=w)<0){type=t;break;}}
  const e={id:(g.evCount=(g.evCount||0)+1),type,by,n:g.turn.n};const byName=g.players[by].name;let text='';
  if(type==='flood'){e.river=Math.floor(Math.random()*RIVERS.length);let lost=0;for(const k in g.track){const inf=EDGE.get(k);if(inf&&inf.rivers.includes(e.river)){delete g.track[k];lost++;}}text='Flood on the '+RIVERS[e.river].name+'! Every bridge over it washed out'+(lost?' ('+lost+' segment'+(lost>1?'s':'')+' of track lost)':'')+'. Nobody can build across it until '+byName+'’s next turn ends.';}
  else if(type==='tax'){const paid=[];for(const pl of g.players){const t=pl.cash>150?15:pl.cash>100?10:pl.cash>50?5:0;if(t){pl.cash-=t;paid.push(pl.name+' $'+t+'M');}}text='Tax time! '+(paid.length?'Paid: '+paid.join(', ')+'.':'Nobody had enough cash to owe anything.');}
  else{let c=pick(CITY_LIST);if(type==='snow'){const opts=[pick(CITY_LIST),pick(CITY_LIST),pick(CITY_LIST)];c=opts.sort((a,b)=>NODES[a].y-NODES[b].y)[0];}
    e.center=c;e.r=type==='snow'?5:type==='strike'?3:3;const nm=CITY.get(c).name;const reg=regionSet(c,e.r);
    if(type==='derail'){const hit=[];g.players.forEach(pl=>{if(pl.pos!=null&&reg.has(pl.pos)){if(pl.loads.length)pl.loads.splice(Math.floor(Math.random()*pl.loads.length),1);pl.stalled=true;hit.push(pl.name);}});text='Derailment near '+nm+'! '+(hit.length?hit.join(' and ')+' lost a load and can’t move next turn.':'Luckily no trains were close by.');}
    else if(type==='strike')text='Strike around '+nm+'! No picking up or delivering in the shaded area until '+byName+'’s next turn ends.';
    else text='Blizzard over '+nm+'! Trains starting a turn in the storm move at half speed, and no building inside it until '+byName+'’s next turn ends.';}
  e.text=text;if(type!=='tax')g.events.push(e);g.lastEvent={id:e.id,text,type};log(g,text);
}
function drawCard(g,by){if(g.eventsOn&&Math.random()<EVENT_CHANCE)applyEvent(g,by);return makeCard();}

let G=null,mode='lobby',gid=null,preview=null,selCity=null,selDemand=null,sheetState='normal',lastTurnSeen=null,lastEventSeen=0;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function initDb(){
  try{

    seatId=id||deviceId();dbTried=true;dbReady=!!db;
    if(db){db.collection('games').onSnapshot(s=>{lobbyGames=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.created||0)-(a.created||0));if(mode==='lobby')render();},()=>{});
      const m=location.hash.match(/^#g-([a-z0-9-]+)$/i);if(m&&mode==='lobby')openOnline(m[1]);}

  }catch(e){dbTried=true;render();}
}

function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('Couldn’t load '+src));document.head.appendChild(el);});}
const fireWrap=x=>({exists:x.exists,id:x.id,data:()=>x.exists?JSON.parse(x.data().s):undefined});
function fireAdapter(fs){return{doc(path){const r=fs.doc(path);return{
  set:d=>r.set({s:JSON.stringify(d),rev:d.rev||0,t:Date.now()}),
  get:async()=>fireWrap(await r.get()),
  delete:()=>Promise.reject({code:'permission-denied'}),
  onSnapshot:(next,err)=>r.onSnapshot(x=>next(fireWrap(x)),e=>err&&err(e))};}};}

  firebase.initializeApp(FIREBASE_CONFIG);db=fireAdapter(firebase.firestore());backend='fire';seatId=deviceId();dbReady=true;
  const m=location.hash.match(/^#(?:j=|g-)([a-z0-9-]+)$/i);if(m){fireIndexAdd(m[1]);openOnline(m[1]);}

  let first=true;

  let have=null;try{have=JSON.parse(ls('wr-link-'+g.id));}catch{}

}
function askSeat(){render();showOverlay('<h3>Who are you?</h3><p class="muted">Pick your player so this phone knows whose turns are yours.</p><div class="row" style="justify-content:center">'+G.players.map((p,i)=>'<button class="btn" type="button" data-act="seat" data-i="'+i+'"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+p.color+';margin-right:6px;vertical-align:-1px"></span>'+esc(p.name)+'</button>').join('')+'</div>');}

/* ================= Actions ================= */
function act(fn){if(!canAct())return;fn();commit();}
function doBuild(){if(!preview||preview.type!=='build')return;const t=G.turn,pl=curP(),pv=preview;if(pv.cost>BUILD_BUDGET-t.spent){toast('That’s over this turn’s $20M build limit.');return;}if(pv.cost>pl.cash){toast('Not enough cash.');return;}act(()=>{for(const k of pv.edges)G.track[k]=t.p;pl.cash-=pv.cost;t.spent+=pv.cost;t.builds.push({edges:pv.edges,cost:pv.cost});t.acted=true;});}
function undoBuild(){act(()=>{const t=G.turn,b=t.builds.pop();if(!b)return;for(const k of b.edges)if(G.track[k]===t.p)delete G.track[k];curP().cash+=b.cost;t.spent-=b.cost;});}
function doMove(){if(!preview||preview.type!=='move')return;const pv=preview,pl=curP();if(pv.fee>pl.cash){toast('Not enough cash for the track fee.');return;}act(()=>{const t=G.turn;for(const o of pv.owners){G.players[o].cash+=USE_FEE;t.fees.push(o);}pl.cash-=pv.fee;pl.pos=pv.path[pv.path.length-1];t.moves=Math.max(0,t.moves-pv.steps);t.acted=true;if(pv.fee)log(G,pl.name+' paid $'+pv.fee+'M to use other track.');});}

function pickup(good){act(()=>{const pl=curP();if(pl.loads.length>=TRAINS[pl.train].cap||inEvent(G,'strike',pl.pos))return;pl.loads.push(good);G.turn.acted=true;});}
function dump(i){act(()=>{curP().loads.splice(i,1);});}
function deliver(ci,di){act(()=>{const pl=curP(),d=pl.cards[ci][di];const li=pl.loads.indexOf(d.good);if(li<0||pl.pos!==d.dest||inEvent(G,'strike',pl.pos))return;pl.loads.splice(li,1);pl.cash+=d.pay;log(G,pl.name+' delivered '+d.good+' to '+CITY.get(d.dest).name+' for $'+d.pay+'M.');pl.cards[ci]=drawCard(G,G.turn.p);G.turn.acted=true;});selDemand=null;}
function doneMoving(){act(()=>{G.turn.phase='build';});}
function upgrade(to){const pl=curP();if(pl.cash<UPGRADE_COST){toast('Upgrades cost $20M.');return;}act(()=>{pl.cash-=UPGRADE_COST;pl.train=to;G.turn.upgraded=true;G.turn.spent=BUILD_BUDGET;log(G,pl.name+' upgraded to '+TRAINS[to].name+'.');});}

function finishTurn(){const wasMine=canAct();act(()=>{endTurn(G);});selDemand=null;afterTurn(wasMine);}

/* ================= Map tap ================= */
function onTap(node){
  if(node==null){preview=null;selCity=null;render();return;}
  selCity=CITY.has(node)?node:null;
  if(G&&canAct()){
    const t=G.turn,pl=curP();
    if(t.phase==='build'&&!t.upgraded){
      if(preview&&preview.type==='build'&&preview.target===node){doBuild();return;}
      const bp=buildPath(G,t.p,node);preview=bp?{type:'build',target:node,...bp}:null;
      if(!bp&&!selCity)toast('Can’t build there. Track has to start at a major city or your own line.');
    }else if(t.phase==='move'&&t.kind==='op'){
      if(pl.pos==null){if(CITY.has(node)&&netNodes(G,t.p).has(node)){placeTrain(node);return;}toast('Tap a city on your own track to place your train.');}
      else{if(preview&&preview.type==='move'&&preview.target===node){doMove();return;}const mp=movePlan(G,node);preview=mp?{type:'move',target:node,...mp}:null;}
    }
  }
  if(sheetState==='collapsed')sheetState='normal';
  render();
}

function regenCards(){for(const p of G.players)p.cards=[makeCard(),makeCard(),makeCard()];}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'closeOverlay':$('#overlay').hidden=true;render();break;
    case 'open':openOnline(b.dataset.id);break;
    case 'create':createOnline('short');break;
    case 'local':startLocal(false);break;
    case 'localResume':startLocal(true);break;
    case 'newLink':startLink(null);break;
    case 'openLink':startLink(b.dataset.id);if(linkSeat()==null&&G.status!=='setup')askSeat();break;
    case 'delLink':if(confirm('Remove this game from this phone?')){ls('wr-link-'+b.dataset.id,null);let idx=[];try{idx=JSON.parse(ls('wr-link-index')||'[]');}catch{}ls('wr-link-index',JSON.stringify(idx.filter(x=>x!==b.dataset.id)));render();}break;
    case 'loadCode':{const v=($('#code').value||'').trim();if(v)receiveCode(v);break;}
    case 'seat':setLinkSeat(+b.dataset.i);$('#overlay').hidden=true;render();break;
    case 'pickSeat':askSeat();break;
    case 'share':shareTurn();break;
    case 'copyLink':copyTurn('link');break;
    case 'lobby':goLobby();break;
    case 'invite':shareInvite();break;
    case 'copyInvite':copyText(inviteLink(),'Invite link copied.');break;
    case 'delFire':if(confirm('Remove this game from this phone? You can rejoin with the invite link.')){fireIndexDel(b.dataset.id);render();}break;
    case 'joinCode':{const v=($('#jcode').value||'').trim();const m=v.match(/(?:#j=|#g-)?([a-z0-9]+-[a-z0-9]+)\s*$/i);if(m)openOnline(m[1]);else toast('That doesn’t look like an invite link.');break;}
    case 'claim':if(G&&confirm('Take the seat for '+G.players[+b.dataset.i].name+' on this phone?')){G.players[+b.dataset.i].seat=seatId;commit();}break;
    case 'map':if(G&&G.status==='setup'){G.map=b.dataset.map;loadMap(G.map);regenCards();render.fitted=false;resize();commit();}break;
    case 'len':if(G&&G.status==='setup'){G.len=b.dataset.len;commit();}break;
    case 'ev':if(G&&G.status==='setup'){G.eventsOn=b.dataset.on==='1';commit();}break;
    case 'join':{const nm=($('#nm').value||'').trim()||$('#nm').placeholder;const sel=document.querySelector('.sw[aria-pressed="true"]');const color=sel?sel.dataset.color:(COLORS.find(c=>!G.players.some(p=>p.color===c[1]))||COLORS[0])[1];if(G.players.some(p=>p.color===color)){toast('That crayon’s taken.');break;}addPlayer(G,mode==='online'?seatId:mode+'-'+G.players.length,nm.slice(0,14),color);commit();break;}
    case 'start':if(G.players.length>=2){if(mode==='link')setLinkSeat(0);startGame(G);commit();}break;
    case 'build':doBuild();break;
    case 'move':doMove();break;
    case 'clear':preview=null;render();break;
    case 'undo':undoBuild();break;
    case 'end':finishTurn();break;
    case 'doneMove':doneMoving();break;
    case 'discard':if(confirm('Swap all three cards for new ones? This ends your turn.'))discardHand();break;
    case 'upg':upgrade(+b.dataset.u);break;
    case 'pick':pickup(b.dataset.g);break;
    case 'dump':dump(+b.dataset.i);break;
    case 'deliver':deliver(+b.dataset.c,+b.dataset.d);break;
    case 'dem':{const c=+b.dataset.c,d=+b.dataset.d;selDemand=selDemand&&selDemand.c===c&&selDemand.d===d?null:{c,d};render();break;}
  }
});
document.addEventListener('click',e=>{const sw=e.target.closest('.sw');if(!sw||sw.disabled)return;document.querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed',String(x===sw)));});
$('#grab').addEventListener('click',()=>{sheetState=sheetState==='collapsed'?'normal':'collapsed';render();});
$('#menuBtn').addEventListener('click',goLobby);
window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#t=(.+)$/);if(m)receiveCode(m[1]);});

loadMap('na');
new ResizeObserver(resize).observe(cv);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
resize();
{const m=location.hash.match(/^#t=(.+)$/);if(m)receiveCode(m[1]);else render();}
initDb();

</script>
</body>
</html>
